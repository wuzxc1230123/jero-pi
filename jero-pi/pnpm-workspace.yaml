# Use hoisted node_modules so the pi manifest's companion node_modules/ resource
# references (pi-fovea/pi-intercom/pi-lens/pi-web-access/rpiv/pi-pretty entries
# and skills dirs) materialize as real paths in dev checkouts and local-path
# installs. Companions are deliberately NOT bundled: pi-pretty/pi-lens carry
# platform-specific native dependencies that must resolve via the host's
# npm install on the user's machine.
nodeLinker: hoisted

# Reject installs of packages published less than 3 days ago (4320 minutes).
# Supply-chain defense — most malicious packages are caught within a few days.
minimumReleaseAge: 4320

# Approved Pi 0.85.1 upgrade; frozen installs also verify release age.
# Keep the exception version-specific, including Pi's required aligned packages.
minimumReleaseAgeExclude:
  - '@earendil-works/pi-coding-agent@0.85.1'
  - '@earendil-works/chord@0.85.1'
  - '@earendil-works/pi-agent-core@0.85.1'
  - '@earendil-works/pi-ai@0.85.1'
  - '@earendil-works/pi-tui@0.85.1'
  - '@earendil-works/pi-telemetry@0.85.1'

# Refuse to install a package whose maintainer trust level has decreased
# (e.g. previously verified publisher loses verification).
trustPolicy: no-downgrade

# Block transitive dependencies from using git: or tarball sources.
blockExoticSubdeps: true

# 供应链 overrides（2026-10-01 例行处置 + 当日回退事故修正）：对既有钉版
# 树的传递依赖 advisory 做最小增量修补——undici 8.9.0 → 8.10.2
# （GHSA-rfgv-xxqx-mfg5 DoS / GHSA-w293-vg96-wgc3 TLS 校验绕过）、
# brace-expansion 5.0.9 → 5.0.12（GHSA-qhr7-859c-m2p7 /
# GHSA-8436-99hf-9mmv 栈耗尽 + moderate 级 GHSA-8436 后续修补）。两版本均在依赖方声明的 semver 区间内且
# 满足 ≥3 天龄期门。**生效位置就是本文件**：本仓 pnpm 11.1.1 存在本
# workspace 文件时忽略 package.json 的 pnpm.overrides（2026-10-01 以
# 删净 node_modules 的全新解析实验证实——manifest overrides 完全不被
# 采纳，yaml overrides 随清单变更触发的重解析生效）。仅作用于本仓/CI
# 的 lockfile 树；终端用户机器按 semver 区间现装，天然解析到已修复版本。
overrides:
  undici: 8.10.2
  brace-expansion: 5.0.12

allowBuilds:
  '@ast-grep/cli': false
  '@google/genai': true
  esbuild: false
  koffi: true
  protobufjs: true
