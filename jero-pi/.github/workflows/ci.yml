name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Design §9.5: the 6 pinned companion dependencies are a supply-chain
      # surface (pi-tui is host-provided as a "*" peer). Pinning + lockfile +
      # workspace trust policy defend installs; this audit gate fails CI on a
      # high/critical advisory in the resolved production dependency graph.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Run tests
        run: pnpm test

      - name: Type check
        run: pnpm run typecheck

      - name: Verify generated runtime modules
        run: pnpm run check:runtime-modules

      # Design §9.1: the authority trust boundary is enforced structurally.
      - name: Authority module boundary
        run: pnpm run check:authority-boundary

      # Test anti-patterns (pass-always asserts, reasonless skips, wall-clock
      # assertions, magic sleeps) are ratcheted toward zero; see the script header.
      - name: Test quality ratchet
        run: pnpm run check:test-quality

      - name: Verify package contents
        run: node scripts/verify-package-files.mjs

      # Design §5.5: the packed artifact itself must carry no distribution-chain
      # residue. verify-package-files.mjs asserts the worktree; this gate
      # asserts the tarball file list (files-array mistakes would only show here).
      - name: Packed artifact contains no distribution-chain files
        run: |
          pnpm pack --dry-run --config.ignore-scripts=true > pack-listing.txt
          cat pack-listing.txt
          if grep -E "contracts/|\.gentle-ai/|install-gentle-ai|gentle-ai-installer|gentle-ai-binary|telemetry-trigger|provider-contract" pack-listing.txt; then
            echo "::error::packed artifact contains distribution-chain files"
            exit 1
          fi

      # Design §5.5: the suite must pass with every network route blackholed —
      # jero-pi has no install-time or test-time network dependency. Node's
      # fetch only honors the proxy envs when NODE_USE_ENV_PROXY is set.
      - name: Offline test gate (design §5.5)
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          NO_PROXY: ""
          no_proxy: ""
          NODE_OFFLINE: "1"
          NODE_USE_ENV_PROXY: "1"
        run: pnpm test

  review-repository-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Windows Git authority probe
        shell: pwsh
        run: pnpm exec node --experimental-strip-types --test tests/review-repository.test.ts

      - name: Run Windows candidate view regression
        shell: pwsh
        run: |
          $output = & pnpm exec node --experimental-strip-types --test --test-reporter=tap --test-name-pattern "candidate owner|candidate contributor root|candidate executable-mode validation|candidate registry forwards explicit Windows mode validation" tests/review-candidate-view.test.ts 2>&1
          $status = $LASTEXITCODE
          $output | Write-Output
          if ($status -ne 0) { exit $status }
          $passes = [regex]::Match(($output -join "`n"), "(?m)^# pass (\d+)$")
          if ($output -match "(?m)^1\.\.0$" -or !$passes.Success -or [int]$passes.Groups[1].Value -eq 0) { throw "Windows candidate view regression selected no tests" }

